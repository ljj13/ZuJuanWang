<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>提取试卷</title>
  <style>
    :root {
      --paper: #FAF9F6;
      --ink: #2B2722;
      --muted: #8A847A;
      --rule: #E7E2D9;
      --blue: #4285F4;
      --blue-deep: #2F6BD8;
      --blue-wash: #EEF4FE;
      --seal: #C2543D;
      --ok-bg: #E9F5EC;
      --ok-ink: #1F7A3D;
      --err-bg: #FBECEA;
      --err-ink: #B3402E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #26241F;
        --ink: #E8E4DC;
        --muted: #999285;
        --rule: #3B3830;
        --blue: #6B9DF6;
        --blue-deep: #8CB4F8;
        --blue-wash: #2E3A4D;
        --seal: #D06B54;
        --ok-bg: #253528;
        --ok-ink: #7FC98F;
        --err-bg: #3B2825;
        --err-ink: #E08A7B;
      }
    }

    * { box-sizing: border-box; }

    body {
      width: 316px;
      margin: 0;
      padding: 16px 16px 12px 30px;
      position: relative;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    /* 密封线：试卷左侧的装订虚线，这个工具的出身处 */
    .seal-line {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 22px;
      border-right: 1px dashed var(--seal);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .seal-line span {
      writing-mode: vertical-rl;
      letter-spacing: 6px;
      font-size: 10px;
      color: var(--seal);
      opacity: 0.6;
      user-select: none;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--rule);
    }
    header img { width: 30px; height: 30px; display: block; }
    header h1 {
      margin: 0;
      font-family: Georgia, 'Times New Roman', 'SimSun', serif;
      font-weight: 700;
      font-size: 19px;
      letter-spacing: 2px;
    }
    header .ver {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
    }

    main { animation: rise 0.18s ease-out; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }

    .field { padding: 12px 0 2px; }
    .field-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
    }

    /* 分段选择：隐藏原生单选，样式化标签 */
    .segment { display: flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
    .segment input { position: absolute; opacity: 0; pointer-events: none; }
    .segment label {
      flex: 1;
      text-align: center;
      padding: 7px 4px;
      cursor: pointer;
      color: var(--muted);
      background: transparent;
      transition: background 0.15s, color 0.15s;
    }
    .segment label + label { border-left: 1px solid var(--rule); }
    .segment input:checked + label {
      background: var(--blue-wash);
      color: var(--ink);
      font-weight: 600;
    }
    .segment input:focus-visible + label {
      outline: 2px solid var(--blue);
      outline-offset: -2px;
    }
    .segment:hover label:hover { color: var(--ink); }

    .btn {
      width: 100%;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s, transform 0.05s;
    }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }

    .btn-primary {
      background: var(--blue);
      color: #fff;
      font-weight: 600;
      letter-spacing: 4px;
      margin-top: 14px;
    }
    .btn-primary:hover { background: var(--blue-deep); }

    .btn-secondary {
      background: transparent;
      border-color: var(--rule);
      color: var(--ink);
      font-size: 13px;
    }
    .btn-secondary:hover { border-color: var(--blue); background: var(--blue-wash); }

    .export-row { display: flex; gap: 10px; margin-top: 10px; }

    .verify-result {
      display: none;
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .verify-success { background: var(--ok-bg); color: var(--ok-ink); }
    .verify-error { background: var(--err-bg); color: var(--err-ink); }

    footer {
      margin-top: 12px;
      padding-top: 9px;
      border-top: 1px solid var(--rule);
      font-size: 11px;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="seal-line" aria-hidden="true"><span>密封线</span></div>

  <header>
    <img src="icons/icon128.png" alt="">
    <h1>提取试卷</h1>
    <span class="ver">v<span id="extension-version">…</span></span>
  </header>

  <main>
    <div class="field">
      <div class="field-label">版本</div>
      <div class="segment">
        <input type="radio" id="student" name="version" value="student" checked>
        <label for="student">学生版</label>
        <input type="radio" id="teacher" name="version" value="teacher">
        <label for="teacher">教师版</label>
      </div>
      <div class="field-hint" id="version-hint">学生版不含解析，教师版含解析</div>
    </div>

    <div id="analysis-location" style="display: none;">
      <div class="field">
        <div class="field-label">解析位置</div>
        <div class="segment">
          <input type="radio" id="analysis-after-question" name="analysisLocation" value="after-question" checked>
          <label for="analysis-after-question">题后</label>
          <input type="radio" id="analysis-at-end" name="analysisLocation" value="at-end">
          <label for="analysis-at-end">卷尾</label>
        </div>
      </div>
    </div>

    <div class="field">
      <div class="field-label">纸张</div>
      <div class="segment">
        <input type="radio" id="paper-a4" name="paperSize" value="a4" checked>
        <label for="paper-a4">A4 纵向</label>
        <input type="radio" id="paper-b4" name="paperSize" value="b4">
        <label for="paper-b4">B4 横向 · 8开</label>
      </div>
    </div>

    <button class="btn btn-primary" id="extract-btn">提取试卷</button>

    <div class="export-row" style="display: none;">
      <button class="btn btn-secondary" id="save-as-word-btn" style="flex: 1; display: none;">导出 Word</button>
      <button class="btn btn-secondary" id="save-as-pdf-btn" style="flex: 1; display: none;">PDF</button>
    </div>

    <div class="verify-result" id="verify-result" style="display: none;"></div>
  </main>

  <footer>导出的 Word 表格不打印边框；编辑时可在 Word 中开启「查看网格线」。</footer>

  <script src="popup.js"></script>
</body>
</html>
