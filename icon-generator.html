<!DOCTYPE html>
<html>
<head>
  <title>插件图标生成器</title>
  <style>
    .icon-container {
      display: flex;
      gap: 20px;
      margin: 20px;
    }
    .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      color: white;
      font-weight: bold;
    }
    .icon16 {
      width: 16px;
      height: 16px;
      background-color: #4285F4;
      font-size: 8px;
    }
    .icon48 {
      width: 48px;
      height: 48px;
      background-color: #4285F4;
      font-size: 24px;
    }
    .icon128 {
      width: 128px;
      height: 128px;
      background-color: #4285F4;
      font-size: 64px;
    }
    .instructions {
      margin: 20px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div class="instructions">
    <h2>Chrome插件图标生成器</h2>
    <p>请按照以下步骤生成插件图标：</p>
    <ol>
      <li>右键点击下方每个图标，选择"保存图片为"</li>
      <li>分别保存为：
        <ul>
          <li>icon16.png (16x16)</li>
          <li>icon48.png (48x48)</li>
          <li>icon128.png (128x128)</li>
        </ul>
      </li>
      <li>将保存的图标文件放在插件目录中</li>
    </ol>
  </div>
  <div class="icon-container">
    <div class="icon icon128">A</div>
    <div class="icon icon48">A</div>
    <div class="icon icon16">A</div>
  </div>
</body>
</html>
